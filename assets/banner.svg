<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(25px,-15px);opacity:.6}}@keyframes pulsePurple{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.22) translate(-30px,20px);opacity:.55}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}.orb-cyan{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-purple{animation:pulsePurple 10s ease-in-out infinite;transform-origin:1000px 250px}.particle-1{animation:floatParticle 5s ease-in-out infinite}.particle-2{animation:floatParticle 7s ease-in-out infinite 1s}.particle-3{animation:floatParticle 6s ease-in-out infinite 2s}.data-stream{stroke-dasharray:8,12;animation:dashStream 4s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><circle cx="180" cy="110" r="140" fill="url(#accentCyan)" class="orb-cyan" filter="url(#glow)"/><circle cx="1020" cy="240" r="160" fill="url(#accentPurple)" class="orb-purple" filter="url(#glow)"/><path fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5" d="M 0 100 Q 300 220 600 80 T 1200 120" class="data-stream"/><path fill="none" stroke="#a855f7" stroke-opacity=".3" stroke-width="1.5" d="M 0 280 Q 400 160 800 290 T 1200 220" class="data-stream" style="animation-duration:6s"/><circle cx="220" cy="70" r="3" fill="#38bdf8" class="particle-1"/><circle cx="340" cy="300" r="2.5" fill="#818cf8" class="particle-2"/><circle cx="950" cy="90" r="3.5" fill="#c084fc" class="particle-3"/><circle cx="820" cy="320" r="2" fill="#38bdf8" class="particle-1"/><circle cx="1120" cy="140" r="3" fill="#f43f5e" class="particle-2"/><g id="foreground-content"><rect width="350" height="34" x="425" y="48" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="17"/><text x="600" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ THE MODERN WEB ENGINE &amp; SSG ECOSYSTEM</text><text x="600" y="160" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Static Site Generation &amp; Web Publishing</text><text x="600" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">Curated Architecture of Fast SSGs, Headless CMS, Jamstack Engines &amp; Newsletters</text><g transform="translate(230, 260)"><rect width="160" height="36" x="0" y="0" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="80" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Blazing Edge TTFB</text><rect width="170" height="36" x="190" y="0" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="275" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Zero-Database Surface</text><rect width="165" height="36" x="390" y="0" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="472" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📝 Markdown Sovereignty</text><rect width="155" height="36" x="585" y="0" fill="#0f172a" stroke="#334155" stroke-width="1.2" rx="8"/><text x="662" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 ActivityPub &amp; Email</text></g></g></svg>