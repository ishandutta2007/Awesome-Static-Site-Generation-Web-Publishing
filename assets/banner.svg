<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes pulsePurple {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(-30px, 20px); opacity: 0.55; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    .orb-cyan {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-purple {
      animation: pulsePurple 10s ease-in-out infinite;
      transform-origin: 1000px 250px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .data-stream {
      stroke-dasharray: 8, 12;
      animation: dashStream 4s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Behind text) -->
  <circle class="orb-cyan" cx="180" cy="110" r="140" fill="url(#accentCyan)" filter="url(#glow)" />
  <circle class="orb-purple" cx="1020" cy="240" r="160" fill="url(#accentPurple)" filter="url(#glow)" />

  <!-- Dynamic Ambient Lines / Streams -->
  <path class="data-stream" d="M 0 100 Q 300 220 600 80 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="data-stream" d="M 0 280 Q 400 160 800 290 T 1200 220" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" style="animation-duration: 6s;" />

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="220" cy="70" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="340" cy="300" r="2.5" fill="#818cf8" />
  <circle class="particle-3" cx="950" cy="90" r="3.5" fill="#c084fc" />
  <circle class="particle-1" cx="820" cy="320" r="2" fill="#38bdf8" />
  <circle class="particle-2" cx="1120" cy="140" r="3" fill="#f43f5e" />

  <!-- Foreground Content: Perfectly clear and unobscured -->
  <g id="foreground-content">
    <!-- Top Pill / Category Tag -->
    <rect x="425" y="48" width="350" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="600" y="70" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ THE MODERN WEB ENGINE &amp; SSG ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Static Site Generation &amp; Web Publishing</text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Curated Architecture of Fast SSGs, Headless CMS, Jamstack Engines &amp; Newsletters</text>

    <!-- Feature Pillars (Sub-badges in foreground) -->
    <g transform="translate(230, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="80" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Blazing Edge TTFB</text>

      <!-- Pill 2 -->
      <rect x="190" y="0" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="275" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Zero-Database Surface</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="472" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📝 Markdown Sovereignty</text>

      <!-- Pill 4 -->
      <rect x="585" y="0" width="155" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="662" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 ActivityPub &amp; Email</text>
    </g>
  </g>
</svg>
